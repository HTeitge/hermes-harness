# Filtered Docker API for hermes-harness. Default deny. Allowed:
#   read:      ps / images / networks / volumes / info / version / events (lists)
#   per-container (inspect / logs / top / stats / diff / port / exec / lifecycle): ONLY containers
#              whose name starts with $CONTAINER_PREFIX (the replica project). Hex ids and the
#              harness's own containers (hermes, hermes-edge, hermes-docker-proxy) never match,
#              so `docker inspect hermes` cannot read this stack's environment/credentials.
#   exec:      docker exec (create + start + resize + inspect) on prefixed containers
#   lifecycle: start/stop/restart/kill/pause/unpause ONLY when ALLOW_LIFECYCLE=1
# Never: create/run, build, cp (archive), export, attach, commit, push/pull/login, rm, update,
#        rename, volume/network mutation, swarm.
global
    log stdout format raw local0 info
    maxconn 256

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 10s
    timeout client  24h
    timeout server  24h
    timeout tunnel  24h

frontend docker_api
    bind *:2375

    acl m_get   method GET HEAD
    acl m_post  method POST
    acl lifecycle_on env(ALLOW_LIFECYCLE) -m str 1

    acl p_ping       path_reg ^(/v[0-9.]+)?/_ping$
    acl p_version    path_reg ^(/v[0-9.]+)?/version$
    acl p_info       path_reg ^(/v[0-9.]+)?/info$
    acl p_events     path_reg ^(/v[0-9.]+)?/events$
    acl p_c_list     path_reg ^(/v[0-9.]+)?/containers/json$
    acl p_c_read     path_reg ^(/v[0-9.]+)?/containers/"${CONTAINER_PREFIX}"[A-Za-z0-9_.-]*/(json|logs|top|stats|changes|port)$
    acl p_c_exec     path_reg ^(/v[0-9.]+)?/containers/"${CONTAINER_PREFIX}"[A-Za-z0-9_.-]*/exec$
    acl p_e_start    path_reg ^(/v[0-9.]+)?/exec/[^/]+/(start|resize)$
    acl p_e_json     path_reg ^(/v[0-9.]+)?/exec/[^/]+/json$
    acl p_c_life     path_reg ^(/v[0-9.]+)?/containers/"${CONTAINER_PREFIX}"[A-Za-z0-9_.-]*/(start|stop|restart|kill|pause|unpause|wait)$
    acl p_img_list   path_reg ^(/v[0-9.]+)?/images/json$
    acl p_img_read   path_reg ^(/v[0-9.]+)?/images/[^/]+/(json|history)$
    acl p_net_read   path_reg ^(/v[0-9.]+)?/networks(/[^/]+)?$
    acl p_vol_read   path_reg ^(/v[0-9.]+)?/volumes(/[^/]+)?$
    acl p_sys_df     path_reg ^(/v[0-9.]+)?/system/df$

    http-request allow if m_get p_ping
    http-request allow if m_get p_version
    http-request allow if m_get p_info
    http-request allow if m_get p_events
    http-request allow if m_get p_c_list
    http-request allow if m_get p_c_read
    http-request allow if m_get p_img_list
    http-request allow if m_get p_img_read
    http-request allow if m_get p_net_read
    http-request allow if m_get p_vol_read
    http-request allow if m_get p_sys_df
    http-request allow if m_get p_e_json
    http-request allow if m_post p_c_exec
    http-request allow if m_post p_e_start
    http-request allow if m_post p_c_life lifecycle_on
    http-request deny deny_status 403

    default_backend docker_sock

backend docker_sock
    server sock /var/run/docker.sock
