# Egress allowlist proxy for hermes-harness. Only hostnames in /etc/tinyproxy/filter pass.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
Allow 0.0.0.0/0
LogLevel Info
DisableViaHeader Yes
# Domain allowlist: default deny, fnmatch globs, one per line (rendered by entrypoint.sh)
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterType fnmatch
FilterCaseSensitive No
# Only hostnames are filtered (not full URLs): a CONNECT carries just host:port anyway.
FilterURLs No
